apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetman-position-simulator
  labels:
    app: fleetman-position-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleetman-position-simulator
  template:
    metadata:
      labels:
        app: fleetman-position-simulator
    spec:
      containers:
      - name: fleetman-position-simulator
        image: supinfo4kube/position-simulator:1.0.1
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production-microservice
        - name: SPRING_JMS_BROKER_URL
          value: tcp://fleetman-queue.fleetman.svc.cluster.local:61616  
        - name: MESSAGE_SIZE_LIMIT
          value: "1048576"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: fleetman-position-simulator
spec:
  selector:
    app: fleetman-position-simulator
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP